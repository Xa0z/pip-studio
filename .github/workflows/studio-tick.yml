name: Pip Studio tick

# Plans upcoming videos, publishes due ones, collects metrics and sends weekly reports.
# GitHub often starts scheduled runs hours late, so each run ticks every 5 minutes for about 50 minutes
# and then starts the next run itself. The schedule only restarts the chain if it ever stops.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: studio-tick
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      # 0 = no limit (public repos get free minutes).
      ACTIONS_MINUTES_LIMIT: ${{ vars.ACTIONS_MINUTES_LIMIT || '1700' }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx tsx studio/worker/cli.ts loop 50
      # Start the next run (GITHUB_TOKEN may start workflow_dispatch runs). The concurrency group keeps one at a time.
      - if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run studio-tick.yml -R "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" || echo "could not start the next run"


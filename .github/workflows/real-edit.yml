name: Real-footage video

# Makes a video from real footage (free sources, local models) and puts it on the previews-real-edit branch.
# Runs on pull requests that change the real-footage code, or by hand with your own script.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Topic or script (blank = the built-in test script)'
        required: false
      seconds:
        description: 'Longest length in seconds'
        required: false
        default: '20'
  pull_request:
    paths:
      - 'scripts/footage/**'
      - 'scripts/make-video.ts'
      - 'remotion/realedit/**'
      - '.github/workflows/real-edit.yml'

concurrency:
  group: real-edit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.models/hf
      REALEDIT_LIBRARY: ${{ github.workspace }}/library
      PEXELS_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install packages
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Make sure the Remotion browser is there
        run: npx remotion browser ensure

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/footage/requirements.txt

      - name: Install OpenCLIP, PySceneDetect, faster-whisper (CPU)
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/footage/requirements.txt

      - name: Cache models (OpenCLIP, faster-whisper, Kokoro)
        uses: actions/cache@v4
        with:
          path: .models
          key: realedit-models-${{ runner.os }}-${{ hashFiles('scripts/footage/requirements.txt') }}
          restore-keys: realedit-models-${{ runner.os }}-

      # The footage library grows run by run: a new cache is saved after every run, the newest one is restored.
      - name: Restore footage library
        uses: actions/cache/restore@v4
        with:
          path: library
          key: realedit-library-${{ github.run_id }}
          restore-keys: realedit-library-

      - name: Make the video
        env:
          INPUT_SCRIPT: ${{ inputs.script }}
          INPUT_SECONDS: ${{ inputs.seconds || '20' }}
        run: |
          if [ -n "$INPUT_SCRIPT" ]; then
            npx tsx scripts/make-video.ts --seconds "$INPUT_SECONDS" "$INPUT_SCRIPT"
          else
            npx tsx scripts/make-video.ts --seconds "$INPUT_SECONDS" --slug test-moon --file scripts/footage/sample-script.txt
          fi

      - name: Save footage library
        if: always()
        uses: actions/cache/save@v4
        with:
          path: library
          key: realedit-library-${{ github.run_id }}

      - name: Put the video on the previews-real-edit branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cp library/credits.json out/library-credits.json 2>/dev/null || true
          bash scripts/push-previews.sh previews-real-edit "Real-footage video from run ${{ github.run_id }}" out/*.mp4 out/*.credits.json out/*.props.json out/library-credits.json

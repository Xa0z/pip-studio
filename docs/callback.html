<body><main><nav><a href="index.html">Home</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></nav>
<h1>TikTok <span>login</span></h1>
<p>Copy these two values into the terminal where <code>npm run tiktok:login</code> is waiting.</p>
<div class="card"><p><b>Code</b><br><code id="code">(none)</code></p><p><b>State</b><br><code id="state">(none)</code></p><p id="err" style="color:#FF6F6F"></p></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('code').textContent=q.get('code')||'(none)';
document.getElementById('state').textContent=q.get('state')||'(none)';
if(q.get('error'))document.getElementById('err').textContent='TikTok said: '+q.get('error')+' '+(q.get('error_description')||'');
</script>
